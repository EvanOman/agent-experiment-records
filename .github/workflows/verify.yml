name: Verification and MNIST replay

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/requirements*.txt'
      - 'requirements*.txt'
      - 'experiments/**/model/**'
      - 'experiments/**/evidence/**'
      - 'experiments/**/transcript/**'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  EXPERIMENT: experiments/2026-11-04-mnist-direct-weights

jobs:
  checks:
    name: Offline artifact and inference checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
          cache: pip
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify public evidence and publication hygiene
        run: python scripts/verify_repository.py
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s "$EXPERIMENT/transcript" -p 'test_*.py' -v
      - name: Reconstruct the authored numerical tensors without image data
        run: python "$EXPERIMENT/reproduce.py" verify
      - name: Check synthetic inference
        run: python "$EXPERIMENT/reproduce.py" smoke

  mnist-replay:
    name: Full 10,000-image replay (9603 correct)
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
          cache: pip
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Download the verified source, recreate the split, and replay
        run: |
          python "$EXPERIMENT/reproduce.py" replay \
            --download --output replay-output/mnist.json --expect-correct 9603
      - name: Write the aggregate result to the job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = Path('replay-output/mnist.json')
          if result.exists():
              value = json.loads(result.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Public MNIST replay\n\n')
                  summary.write('This reruns the frozen model on the recorded, now-exposed split. It is not a new blind confirmation.\n\n')
                  summary.write('```json\n' + json.dumps(value, indent=2) + '\n```\n')
          PY
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mnist-replay-${{ github.sha }}
          path: replay-output/
          if-no-files-found: warn
          retention-days: 90
